<div class="cert-modal cert-login-modal" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-modal-title" hidden>
  <div class="cert-modal__backdrop" data-login-modal-close tabindex="-1"></div>
  <div class="cert-modal__dialog" role="document">
    <button type="button" class="cert-modal__close" data-login-modal-close aria-label="Close sign in form">
      <span aria-hidden="true">&times;</span>
    </button>
    <div class="cert-modal__content">
      <div class="cert-modal__header">
        <h2 class="cert-modal__title" id="login-modal-title">Sign In</h2>
        <p class="cert-login-modal__lead">Access your LSU Online Continuing Education account.</p>
      </div>
      <form class="cert-login-modal__form" action="account.html" method="get" novalidate>
        <div class="cert-form__field cert-form__field--outlined">
          <label for="login-username">Email Address <span class="cert-form__required" aria-label="required">*</span></label>
          <input type="email" id="login-username" name="email" required autocomplete="email" placeholder="Email Address" />
        </div>
        <div class="cert-form__field cert-form__field--outlined">
          <label for="login-password">Password <span class="cert-form__required" aria-label="required">*</span></label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Password" />
        </div>
        <p class="cert-login-modal__help">
          <a href="https://ce.lsu.edu/portal/logon.do?method=load" class="cert-link">Forgot username or password?</a>
        </p>
        <button type="submit" class="cert-btn cert-btn--primary cert-btn--md cert-login-modal__submit">Sign In</button>
      </form>
      <div class="cert-login-modal__register">
        <a href="https://ce.lsu.edu/portal/logon.do?method=load" class="cert-login-modal__register-btn">Create an account</a>
      </div>
      <div class="cert-login-modal__brand" aria-label="LSU Online Continuing Education">
        <a href="https://online.lsu.edu/" class="cert-login-modal__brand-logo">
          <img src="images/logo-lsu-online-purple.png" alt="LSU Online" width="300" height="47" class="cert-login-modal__brand-logo-img" />
        </a>
        <span class="cert-login-modal__brand-divider" aria-hidden="true"></span>
        <span class="cert-login-modal__brand-label">Continuing Education</span>
      </div>
    </div>
  </div>
</div>
